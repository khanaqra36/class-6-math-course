<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 6 Math - Ibrar Ali Narejo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#eef2ff;display:flex;justify-content:center}
.phone{width:390px;background:#fff;min-height:100vh;position:relative;padding-bottom:80px}
.header{background:#6a7cff;color:#fff;padding:30px 20px;text-align:center;border-radius:0 0 30px 30px}
.progress{background:#e0e7ff;margin:15px;padding:12px;border-radius:15px}
.bar{height:6px;background:#c7d2fe;border-radius:5px;margin:8px 0}
.bar div{height:100%;background:#4f46e5;width:42%}
.ch{margin:10px 15px;padding:14px;border-radius:16px;display:flex;gap:12px;cursor:pointer;color:#111}
.ch b{font-size:14px}
.c1{background:#ff8a2e}.c2{background:#5ec0c9}.c3{background:#9d7bff}.c4{background:#ff9a9a}.c5{background:#8fd14f}.c6{background:#ffd44d}
.nav{position:fixed;bottom:0;width:390px;background:#fff;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #ddd}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);justify-content:center;align-items:center}
.box{background:#fff;padding:20px;border-radius:15px;width:90%;max-width:360px}
button{width:100%;padding:12px;background:#4f46e5;color:#fff;border:0;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<div class="phone">
<div class="header">
<h2>Class 6 Math — Complete Course</h2>
<p style="font-size:12px;margin-top:6px">Created by IBRAR ALI NAREJO<br>Future Software Engineer from Naudero</p>
</div>
<div class="progress"><b>Overall Progress</b><span style="float:right;color:#4f46e5">42% complete</span><div class="bar"><div></div></div><small>12 chapters • 24 lessons • 18 quizzes</small></div>
<div id="list"></div>
<div class="nav"><span>🏠 Home</span><span>📁 Chapters</span><span>💬 Quiz</span><span>👤 Profile</span></div>
</div>
<div id="modal"><div class="box"><span onclick="modal.style.display='none'" style="float:right;font-size:22px;cursor:pointer">×</span><h3 id="mtitle"></h3><div style="background:#111;color:#fff;padding:25px;border-radius:10px;margin:12px 0;text-align:center">🎥 Lecture Video<br><small>YouTube link yahan lagega</small></div><p id="mdesc"></p><button onclick="modal.style.display='none'">Close Lecture</button></div></div>
<script>
const data=[["Knowing Our Numbers","3 lessons • 2 quizzes • Completed"],["Whole Numbers","2 lessons • 2 quizzes • Completed"],["Playing with Numbers","2 lessons • 1 quiz • Completed"],["Basic Geometrical Ideas","3 lessons • 2 quizzes • In Progress"],["Understanding Elementary Shapes","2 lessons • 1 quiz • Locked"],["Integers","3 lessons • 2 quizzes • Locked"]];
const colors=["c1","c2","c3","c4","c5","c6"];
const list=document.getElementById("list");
data.forEach((d,i)=>{
let div=document.createElement("div");
div.className="ch "+colors[i];
div.innerHTML=`<div style="font-size:28px">📚</div><div><b>Chapter ${i+1}<br>${d[0]}</b><br><small>${d[1]}</small></div>`;
div.onclick=()=>{document.getElementById("mtitle").innerText=d[0];document.getElementById("mdesc").innerText=d[0]+" ka full lecture yahan hoga. Ibrar bhai aap yahan notes aur video add kar sakte ho.";document.getElementById("modal").style.display="flex"};
list.appendChild(div);
});
</script>
</body>
</html>
